org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8

# --- ONLY needed when building on-device in Termux (Method A in README) ---
# The Android Gradle Plugin normally auto-downloads its own copy of aapt2,
# which is an x86_64 glibc Linux binary and will NOT run under Termux
# (you'll get "Exec format error"). This line forces Gradle to use the
# aarch64 aapt2 binary you extracted instead. Uncomment and fix the path
# after you've downloaded it (see README.md, Method A, step 4).
# android.aapt2FromMavenOverride=/data/data/com.termux/files/home/android-sdk-tools/aapt2
